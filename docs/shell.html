    <style>
        /* Shell layout styles */

            display: inline-block;

            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    
    <!--
      Startup FynApp chunks, preloaded in parallel.

      Loading these on demand is a serial waterfall: every FynApp costs a round
      trip for its ~500-byte fynapp-entry.js — which only declares what to fetch
      next — before its chunks can be requested at all. These hints let the
      browser pull the whole set off the initial HTML parse instead.

      `preload as="script"`, not `modulepreload`: nothing here is an ES module.
      Rollup's `system` output is classic-script syntax the SystemJS runtime
      interprets, and SystemJS loads it with a plain `document.createElement(
      'script')` — no `type="module"` (systemjs `features/script-load.ts`). A
      modulepreload warms the module map, which nothing ever reads, and it
      fetches in CORS mode while a same-origin classic script does not, so the
      two requests land in different cache entries — the startup chunk was
      observed being downloaded twice, once per mode. No `crossorigin` for the
      same reason: these hrefs are
      path-relative, so the script tag that follows them is same-origin and
      carries no crossOrigin attribute to match.

      Entries marked fetchpriority="low" are the ones the loader defers to browser
      idle (React 18 and fynapp-x1-v1) — still worth warming, but never ahead of
      what first paint needs.

      Generated at build time from the FynApps' dist dirs by
      scripts/shell-preload.mts. Keep that list in sync with the loader below.
    -->
    <link rel="preload" as="script" href="/fynapp-react-18/dist/fynapp-entry.js" fetchpriority="low">
    <link rel="preload" as="script" href="/fynapp-react-18/dist/_mf-share-surface_esm-react-BeKV73vu.js" fetchpriority="low">
    <link rel="preload" as="script" href="/fynapp-react-18/dist/_mf-share-surface_esm-react-dom-DCB1p8ty.js" fetchpriority="low">
    <link rel="preload" as="script" href="/fynapp-react-19/dist/fynapp-entry.js">
    <link rel="preload" as="script" href="/fynapp-react-19/dist/_mf-share-surface_esm-react-BiJXemGR.js">
    <link rel="preload" as="script" href="/fynapp-react-19/dist/_mf-share-surface_esm-react-dom-Bn8NSrK6.js">
    <link rel="preload" as="script" href="/fynapp-react-middleware/dist/fynapp-entry.js">
    <link rel="preload" as="script" href="/fynapp-react-middleware/dist/main-DyscJOMi.js">
    <link rel="preload" as="script" href="/fynapp-react-middleware/dist/react-context-BRF5lyqu.js">
    <link rel="preload" as="script" href="/fynapp-design-tokens/dist/fynapp-entry.js">
    <link rel="preload" as="script" href="/fynapp-design-tokens/dist/design-tokens-BN_9zyG6.js">
    <link rel="preload" as="script" href="/fynapp-x1-v1/dist/fynapp-entry.js" fetchpriority="low">
    <link rel="preload" as="script" href="/fynapp-x1-v1/dist/main-BtBV31Te.js" fetchpriority="low">
    <link rel="preload" as="script" href="/fynapp-x1-v2/dist/fynapp-entry.js">
    <link rel="preload" as="script" href="/fynapp-x1-v2/dist/main-Dy0vpd8i.js">
    <link rel="preload" as="script" href="/fynapp-ag-grid-lib/dist/fynapp-entry.js">
    <link rel="preload" as="script" href="/fynapp-shell-mw/dist/fynapp-entry.js">
    <link rel="preload" as="script" href="/fynapp-shell-mw/dist/main-BCj5nYGx.js">
    <link rel="preload" as="script" href="/fynapp-shell-mw/dist/shell-layout-CBAFX5RI.js">
    <link rel="preload" as="script" href="/fynapp-sidebar/dist/fynapp-entry.js">
    <link rel="preload" as="script" href="/fynapp-sidebar/dist/component-CZJ6YXu9.js">
    <link rel="preload" as="script" href="/fynapp-sidebar/dist/main-MThzo-zq.js">
    
    

    
    <script src="/system.min.js"></script>
    <script src="/federation-js/dist/federation-js.min.js"></script>
    <script src="/kernel/dist/fynmesh-browser-kernel.min.js"></script>
    

    

    <script>
        (async () => {
            console.log("🏠 Starting FynMesh Shell Demo");

            /*
              Providers that first paint does not need, deferred to browser idle.

              Everything the shell renders up front is React 19 — fynapp-sidebar,
              fynapp-react-middleware, fynapp-x1-v2 — so the React 18 provider and
              its only consumer, fynapp-x1-v1, are ~44KB gzipped of dead weight on
              the critical path. They are still required later: fynapp-2-react18
              import-exposes fynapp-x1@^1.

              The kernel cannot fetch a provider on demand — loadFynApp() imports
              the entry directly, and a consumer loaded without its provider fails
              with SharedModuleNoProviderError, which the kernel swallows into a
              null return (a silently blank region). So this promise is the
              handshake: shell-layout.ts awaits it before loading any FynApp the
              user picks. It resolves even on failure, so a click can never hang.
            */
            let markDeferredDone;
            window.__fynmeshDeferredProviders = new Promise(resolve => {
                markDeferredDone = resolve;
            });
            const loadDeferredProviders = () => {
                const run = async () => {
                    try {
                        console.log("💤 Idle: loading deferred providers...");
                        await fynMeshKernel.loadFynApp("/fynapp-react-18/dist");
                        await fynMeshKernel.loadFynApp("/fynapp-x1-v1/dist");
                        console.log("✅ Deferred providers loaded (React 18, FynApp X1 v1)");
                    } catch (error) {
                        console.error("❌ Failed to load deferred providers:", error);
                    } finally {
                        markDeferredDone();
                    }
                };
                // The timeout caps how long a busy main thread can starve the load.
                if (window.requestIdleCallback) {
                    requestIdleCallback(run, { timeout: 3000 });
                } else {
                    setTimeout(run, 200);
                }
            };

                        try {
                // Preload React dependencies first so they're available for dynamic FynApps
                console.log("📦 Preloading React dependencies...");
                await fynMeshKernel.loadFynApp("/fynapp-react-19/dist");
                console.log("✅ React 19 preloaded");

                // Preload middleware providers that FynApps depend on
                console.log("📦 Preloading middleware providers...");
                await fynMeshKernel.loadFynApp("/fynapp-react-middleware/dist");
                console.log("✅ React middleware preloaded");

                await fynMeshKernel.loadFynApp("/fynapp-design-tokens/dist");
                console.log("✅ Design tokens middleware preloaded");

                // Preload component libraries that FynApps depend on.
                // X1 v1 is React 18-only and loads at idle — see loadDeferredProviders above.
                console.log("📦 Preloading component libraries...");
                await fynMeshKernel.loadFynApp("/fynapp-x1-v2/dist");
                console.log("✅ FynApp X1 v2 preloaded");

                // Preload AG Grid library provider
                console.log("📦 Preloading AG Grid library...");
                await fynMeshKernel.loadFynApp("/fynapp-ag-grid-lib/dist");
                console.log("✅ AG Grid library preloaded");

                // Now load the shell middleware FynApp - it will handle everything else
                console.log("🏠 Loading Shell Middleware /fynapp-shell-mw/dist");
                await fynMeshKernel.loadFynApp("/fynapp-shell-mw/dist");
                console.log("✅ Shell loaded and ready for dynamic FynApp loading");

                // Scheduled only now: idle before this point is still contended by
                // the critical requests above.
                loadDeferredProviders();
            } catch (error) {
                console.error("❌ Failed to load shell:", error);
                // Never leave a would-be click waiting on a promise nothing will settle.
                markDeferredDone();
                document.body.innerHTML = `
                    <div style="padding: 2rem; text-align: center;">
                        <h2 style="color: #dc2626;">Shell Loading Failed</h2>
                        <p>Unable to load the shell middleware. Please check the console for details.</p>
                        <p style="color: #6b7280; font-size: 0.875rem;">Error: ${error.message}</p>
                    </div>
                `;
            }
        })();
    </script>
</head>
<body>
    <!-- Shell will be rendered here by the shell middleware -->
    <div id="shell-root">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column;">
            <div class="loading-indicator" style="width: 32px; height: 32px; border-width: 3px; margin-bottom: 1rem;"></div>
            <p style="color: #6b7280;">Loading FynMesh Shell...</p>
        </div>
    </div>
    <!--
    The federation inspector, loaded last on purpose.

    It is an observer: it reports on how this page loaded, so it must not be
    part of what it loaded. Fetching it with the rest of the scripts would put
    a megabyte of devtool ahead of the fynapps in the network queue and put its
    own parse and mount inside the measurements it is there to show.

    So it waits for the load event, then two frames (the first is the paint the
    load event preceded, the second is the one after it), then for the browser
    to be idle -- by which time the fynapps have rendered. The fetch itself is
    async and fetchPriority="low", so even the request is queued behind
    anything the page still wants.

    The badge appears in the corner when it is ready; Ctrl+Shift+M opens it.
-->
<script>
    (function () {
        var src = "/federation-inspector.min.js";

        function load() {
            var s = document.createElement("script");
            s.src = src;
            s.async = true;
            if ("fetchPriority" in s) {
                s.fetchPriority = "low";
            }
            document.head.appendChild(s);
        }

        function whenIdle() {
            if (window.requestIdleCallback) {
                // the timeout is a backstop, not a target: a page that never
                // goes idle should still end up with the badge
                requestIdleCallback(load, { timeout: 10000 });
            } else {
                setTimeout(load, 2000);
            }
        }

        function afterPaint() {
            var waiting = true;
            function go() {
                if (waiting) {
                    waiting = false;
                    whenIdle();
                }
            }
            // two frames: the first is the paint the load event preceded, the
            // second is the one after it
            requestAnimationFrame(function () {
                requestAnimationFrame(go);
            });
            // ...but a page in a background tab is never given a frame, and
            // waiting for one there means waiting forever. Measured: a tab
            // that had not painted yet sat with the script element created and
            // nothing behind it.
            setTimeout(go, 3000);
        }

        if (document.readyState === "complete") {
            afterPaint();
        } else {
            addEventListener("load", afterPaint, { once: true });
        }
    })();
</script>

</body>
