<body class="" style="min-height: 100vh;">
    
    <div id="fynops-root">Loading FynOps, a demo app for FynMesh...</div>

    
    <script>
        (async () => {
            try {
                /*
                  Every FynApp resolves by name to /<name>/dist/. The React
                  provider shows range-based resolution on purpose: one package
                  name, fynapp-react-lib, ships as two versions, and the major in
                  the consumer's range picks which one loads. Keep it that way.
                */
                fynMeshKernel.setRegistryResolver(async (name, range) => {
                    const dir = name === "fynapp-react-lib"
                        ? (/^[~^]?18(\.|$)/.test(range || "") ? "fynapp-react-18" : "fynapp-react-19")
                        : name;
                    const distBase = `/${dir}/dist/`;
                    return { name, version: "0.0.0", url: `${distBase}fynapp.manifest.json`, distBase };
                });

                // Only the shell is named here. The kernel reads its manifest and
                // loads React first; the shell then loads each feature by name.
                await fynMeshKernel.loadFynAppsByName([{ name: "fynops-shell" }]);

                // Phase 0 spikes: ?load=a,b,c loads each /<name>/dist in order.
                const load = new URLSearchParams(location.search).get("load");
                for (const name of load ? load.split(",") : []) {
                    await fynMeshKernel.loadFynApp(`/${name}/dist`);
                }
            } catch (error) {
                console.error("❌ Failed to load FynOps:", error);
                document.getElementById("fynops-root").textContent =
                    `FynOps failed to load: ${error.message}`;
            }
        })();
    </script>
