<!-- Load core scripts -->
{% if isProduction %}
<script src="{{pathPrefix}}system.min.js"></script>
<script src="{{pathPrefix}}federation-js/dist/federation-js.min.js"></script>
<script src="{{pathPrefix}}kernel/dist/fynmesh-browser-kernel.min.js"></script>
{% else %}
<script src="{{pathPrefix}}system.js"></script>
<script src="{{pathPrefix}}federation-js/dist/federation-js.dev.js"></script>
<script src="{{pathPrefix}}kernel/dist/fynmesh-browser-kernel.dev.js"></script>
{% endif %}

<!-- Lazy Loader for deferred app loading -->
<script src="{{pathPrefix}}lazy-loader.js"></script>

<script>
    (async () => {
        // Configure kernel manifest resolver with path prefix (demo only)
        if (typeof fynMeshKernel?.setRegistryResolver === "function") {
            const prefix = "{{pathPrefix}}";

            // Version-aware package mapping: package@range -> directory
            const versionMapping = {
                "fynapp-x1": {
                    "^1.0.0": "fynapp-x1-v1",
                    "^2.0.0": "fynapp-x1-v2",
                    "default": "fynapp-x1-v2"  // Default to v2 if no version specified
                },
                "fynapp-react-lib": {
                    "^18.0.0": "fynapp-react-18",
                    "^19.0.0": "fynapp-react-19",
                    "default": "fynapp-react-19"  // Default to React 19
                },
                "esm-react": {
                    "^18.0.0": "fynapp-react-18",
                    "^18.3.0": "fynapp-react-18",
                    "^19.0.0": "fynapp-react-19",
                    "default": "fynapp-react-19"  // Default to React 19
                }
            };

            fynMeshKernel.setRegistryResolver(async (name, range) => {
                let dirName = name;  // Default to the package name

                // Check if we have version-specific mappings for this package
                const mappings = versionMapping[name];
                if (mappings) {
                    if (range && mappings[range]) {
                        // Use version-specific mapping if available
                        dirName = mappings[range];
                    } else if (mappings.default) {
                        // Use default mapping if no version specified or no match
                        dirName = mappings.default;
                    }
                }

                // Extract version from directory name (e.g., "fynapp-x1-v2" -> "2.0.0", "fynapp-react-18" -> "18.0.0")
                // This ensures unique keys in the dependency graph
                let version = "0.0.0";
                const versionMatch = dirName.match(/-v?(\d+)$/);
                if (versionMatch) {
                    version = `${versionMatch[1]}.0.0`;
                }

                return {
                    name,
                    version,
                    url: `${prefix}${dirName}/dist/fynapp.manifest.json`,
                    distBase: `${prefix}${dirName}/dist/`,
                };
            });
        }

        // STEP 1: All React providers now automatically loaded via shared-providers
        // No explicit pre-loading needed - kernel automatically detects and loads providers
        // based on consumer manifests' shared-providers declarations

        // STEP 2: Load consumer FynApps - kernel will automatically resolve dependencies
        // including middleware providers and component libraries from manifests
        console.log("DEBUG: Starting automatic dependency resolution");

        // Feature flags to control which FynApps to load
        // Values: true = eager load, "lazy" = deferred load with UI
        const features = {
            "fynapp-2-react18": "lazy",  // Deferred loading with button and countdown
            "fynapp-1": true,
            "fynapp-1-b": true,
            "fynapp-3-marko": true,
            "fynapp-4-vue": true,
            "fynapp-5-preact": true,
            "fynapp-6-react": true,
            "fynapp-7-solid": true,
            "fynapp-8-svelte": true,
            "fynapp-notes": true
        };

{% if not isProduction %}
        /*
         * Diagnostics lab: opt-in, and absent unless the url asks for it.
         *
         * Several of the inspector's diagnostics are held to "fires on nothing
         * healthy, verified against the real demo", and this page is the
         * baseline that is verified against. An app added here unconditionally
         * would be an app every later reader has to subtract by hand, so the
         * ones that exist to be *looked at* rather than demonstrated live
         * behind `?lab=`, which no default page carries:
         *
         *   ?lab=bundled   fynapp-bundled -- its dist is combined, so the page
         *                  carries a real combined bundle. Perfectly healthy;
         *                  it is opt-in only so /demo.html keeps shipping the
         *                  one-file-per-chunk dev build it always has.
         *   ?lab=mw        fynapp-mw-mismatch -- misdeclares its middleware, so
         *                  the two amber resolution branches have something to
         *                  report. This one really is unhealthy.
         *   ?lab=all       every lab app at once.
         *
         * Dev build only. The published site copies an explicit list of app
         * directories and the lab apps are not in it, so a shipped switch would
         * ask the kernel for a dist that is not there -- broken rather than
         * inert. Omitting the block instead makes `?lab=` do nothing in
         * production, which is what a dev-only affordance should do.
         */
        const lab = new Set(
            new URLSearchParams(location.search)
                .getAll("lab")
                .flatMap((v) => v.split(","))
                .map((v) => v.trim())
                .filter(Boolean)
        );
        const inLab = (name) => lab.has("all") || lab.has(name);

        if (inLab("bundled")) {
            features["fynapp-bundled"] = true;
        }

        if (inLab("mw")) {
            /*
             * `unresolved` is not a branch a FynApp can declare its way into.
             * It is what the collector reports when a middleware IS registered
             * and still resolves to nothing: a version map whose `default` slot
             * is not backed by any version key in it. `registerMiddleware`
             * writes both from the same object, so a registry the kernel built
             * is never in that state -- only one that arrived from somewhere
             * else is, which is exactly what `initRunTime` accepts and what a
             * clone or a serialise/parse round trip produces.
             *
             * So it is staged here, in the open, rather than faked inside an
             * app: one entry whose only version key holds something that is not
             * a registration. fynapp-mw-mismatch declares a use of it.
             */
            const registry = fynMeshKernel?.runTime?.middlewares;
            if (registry) {
                registry["fynapp-phantom-mw::layout-tokens"] = { "1.0.0": "[unreadable]" };
            }
            features["fynapp-mw-mismatch"] = true;
        }
{% endif %}

        // Separate eager and lazy apps
        const requested = [];
        const lazyApps = [];

        Object.entries(features).forEach(([name, mode]) => {
            if (mode === "lazy") {
                lazyApps.push({ name, mode: "lazy" });
            } else if (mode === true) {
                requested.push({ name });
            }
        });

        // Load eager apps first
        if (requested.length > 0) {
            await fynMeshKernel.loadFynAppsByName(requested, { concurrency: 4 });
        }

        // Initialize lazy loaders after eager apps complete
        lazyApps.forEach(({ name }) => {
            console.debug(`🔄 Initializing lazy loader for ${name}`);
            const loader = new LazyLoader(name, "FynApp 2", fynMeshKernel, { countdown: 10 });
            loader.init();
        });
    })();
</script>
